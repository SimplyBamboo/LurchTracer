name: Build Windows

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish single exe
        run: dotnet publish .\LurchTracer.csproj --configuration Release --runtime win-x64 --self-contained true --output .\publish

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: LurchTracer-Windows-x64
          path: publish/LurchTracer.exe
          if-no-files-found: error
